name: Deploy to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore licensed Areal webfonts
        env:
          AREAL_REGULAR_A: ${{ secrets.AREAL_REGULAR_A }}
          AREAL_REGULAR_B: ${{ secrets.AREAL_REGULAR_B }}
          AREAL_BOLD_A: ${{ secrets.AREAL_BOLD_A }}
          AREAL_BOLD_B: ${{ secrets.AREAL_BOLD_B }}
        run: |
          test -n "$AREAL_REGULAR_A" && test -n "$AREAL_REGULAR_B"
          test -n "$AREAL_BOLD_A" && test -n "$AREAL_BOLD_B"
          mkdir -p public/fonts
          printf '%s%s' "$AREAL_REGULAR_A" "$AREAL_REGULAR_B" | base64 --decode > public/fonts/ABCAreal-Regular.woff2
          printf '%s%s' "$AREAL_BOLD_A" "$AREAL_BOLD_B" | base64 --decode > public/fonts/ABCAreal-Bold.woff2
          printf '%s  %s\n' \
            '8969ea93c0c8bbc53e5ebb20c8d2ae51a686c9bbf0c5ddd437855ef4792d3054' 'public/fonts/ABCAreal-Regular.woff2' \
            '89ff1beca5c10f6c46290bbe92066a49cff895007f40db5659f6068b8d85aa4f' 'public/fonts/ABCAreal-Bold.woff2' \
            | sha256sum --check

      - name: Typecheck photo publisher Worker
        run: pnpm --filter photo-publisher-worker typecheck

      - name: Verify public media
        run: pnpm test

      - name: Build Next.js site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
